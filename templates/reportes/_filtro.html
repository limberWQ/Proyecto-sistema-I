<div class="card no-print mb-2">
    <form method="GET" style="display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-end;">
        <div class="form-group" style="margin:0; min-width:160px;">
            <label>Período</label>
            <select name="periodo" id="periodo" onchange="this.form.submit()">
                <option value="hoy"         {% if periodo == 'hoy' %}selected{% endif %}>Hoy</option>
                <option value="semana"      {% if periodo == 'semana' %}selected{% endif %}>Esta semana</option>
                <option value="mes"         {% if periodo == 'mes' %}selected{% endif %}>Este mes</option>
                <option value="anio"        {% if periodo == 'anio' %}selected{% endif %}>Este año</option>
                <option value="todo"        {% if periodo == 'todo' %}selected{% endif %}>Todo el historial</option>
                <option value="personalizado" {% if periodo == 'personalizado' %}selected{% endif %}>Rango de fechas específico</option>
            </select>
        </div>
        {% if periodo == 'personalizado' %}
        <div class="form-group" style="margin:0;">
            <label>Desde</label>
            <input type="date" name="fecha_desde" value="{{ request.args.get('fecha_desde', '') }}">
        </div>
        <div class="form-group" style="margin:0;">
            <label>Hasta</label>
            <input type="date" name="fecha_hasta" value="{{ request.args.get('fecha_hasta', '') }}">
        </div>
        <button type="submit" class="btn btn-primary">Aplicar</button>
        {% endif %}
        <button type="button" onclick="window.print()" class="btn btn-secondary">Imprimir</button>
        <a href="{{ url_for('reportes.index') }}" class="btn btn-secondary">← Volver</a>
    </form>
</div>

<div class="print-header" style="display:none;">
    <div class="print-brand">Transporte Interdepartamental</div>
    <h2>{{ titulo_reporte }}</h2>
    <p>
        {% if inicio and fin %}
            Período: {{ inicio.strftime("%d/%m/%Y") }} al {{ fin.strftime("%d/%m/%Y") }}
        {% else %}
            Período: todo el historial
        {% endif %}
    </p>
</div>
